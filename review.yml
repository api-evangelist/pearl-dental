actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket (or any public) protocol surface exists to document. Pearl publishes
    no self-serve developer API, so this entry is an honest partner/OEM-gated stub:
    three modeled, partner-gated API surfaces pointing at real Pearl product and
    integration pages, a contact-sales Plans file built only from clearly-attributed
    third-party pricing observations, and no fabricated OpenAPI/rate-limit/finops/
    collection artifacts. No AsyncAPI document was created because there is no
    documented server-push transport on a Pearl API.
