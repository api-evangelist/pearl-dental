name: Pearl
kind: company
description: Pearl is a dental AI computer-vision company whose FDA-cleared products -
  Second Opinion (real-time pathology and restorative detection on 2D and 3D dental
  radiographs), Practice Intelligence (clinical and operational analytics over full
  practice-management-system data), and Precheck (AI insurance claim review) - are
  delivered by embedding Pearl's cloud AI into third-party imaging and practice
  management software rather than through a public, self-serve developer API. Pearl
  integrates natively with 40+ imaging/PMS platforms (DEXIS, Carestream, Planmeca
  Romexis, Dentsply Sirona Sidexis, Apteryx XVWeb, MiPACS, Open Dental, Dentrix,
  Eaglesoft, Curve, Denticon, Software of Excellence EXACT) and is an authorized
  vendor in the Henry Schein One API Exchange. There is no publicly documented,
  self-signup Pearl developer API, SDK, or OpenAPI reference; API access is
  partner/OEM-gated and arranged through Pearl's integrations and sales teams. The
  API surfaces below are modeled from Pearl's public product descriptions and
  integration architecture, not from published Pearl API reference documentation.
